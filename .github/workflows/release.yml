name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build executables
        run: |
          bun build ./src/commander.ts --compile --target=bun-linux-x64 --outfile=commander-linux-x64
          bun build ./src/commander.ts --compile --target=bun-linux-arm64 --outfile=commander-linux-arm64
          bun build ./src/commander.ts --compile --target=bun-darwin-x64 --outfile=commander-macos-x64
          bun build ./src/commander.ts --compile --target=bun-darwin-arm64 --outfile=commander-macos-arm64
          bun build ./src/commander.ts --compile --target=bun-windows-x64 --outfile=commander-windows-x64.exe

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: |
            commander-linux-x64
            commander-linux-arm64
            commander-macos-x64
            commander-macos-arm64
            commander-windows-x64.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Get version from tag
        id: version
        env:
          GIT_REF: ${{ github.ref }}
        run: echo "VERSION=${GIT_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Commander v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: |
            artifacts/release-binaries/commander-linux-x64
            artifacts/release-binaries/commander-linux-arm64
            artifacts/release-binaries/commander-macos-x64
            artifacts/release-binaries/commander-macos-arm64
            artifacts/release-binaries/commander-windows-x64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
